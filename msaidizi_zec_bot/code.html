<script>
        function toggleLanguage() {
            const btnText = document.getElementById('lang-text');
            btnText.innerText = btnText.innerText === 'English' ? 'Swahili' : 'English';
        }

        const chatContainer = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            chatInput.value = '';

            // Simulate bot response
            setTimeout(() => {
                appendMessage("Asante kwa swali lako. Ninashughulikia jibu sahihi kwa ajili yako...", 'bot');
            }, 800);
        }

        function sendQuickReply(text) {
            appendMessage(text, 'user');
            setTimeout(() => {
                let response = "Samahani, kwa sasa taarifa hizo zinahudumiwa na mtoa huduma wa binadamu. Unaweza kupiga simu namba 0800 000 111.";
                if(text.includes('lini')) response = "Uchaguzi wa Zanzibar umepangwa kufanyika mwezi wa 10, 2025.";
                if(text.includes('jiandikisha')) response = "Unaweza kujiandikisha katika kituo chochote cha ZEC kilicho karibu nawe na kitambulisho chako cha Mkaazi.";
                appendMessage(response, 'bot');
            }, 600);
        }

        function appendMessage(text, sender) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const messageDiv = document.createElement('div');
            messageDiv.className = sender === 'user' ? 'flex justify-end' : 'flex items-start gap-sm';
            
            if (sender === 'user') {
                messageDiv.innerHTML = `
                    <div class="chat-bubble-right bg-surface-container-highest text-on-surface p-md max-w-[85%] shadow-sm">
                        <p class="font-body-md text-body-md">${text}</p>
                        <span class="text-[10px] opacity-60 mt-2 block text-right">${time}</span>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-white">
                        <span class="material-symbols-outlined text-[16px]" data-icon="smart_toy">smart_toy</span>
                    </div>
                    <div class="chat-bubble-left bg-primary text-on-primary p-md max-w-[85%] shadow-sm">
                        <p class="font-body-md text-body-md">${text}</p>
                        <span class="text-[10px] opacity-70 mt-2 block text-right">${time}</span>
                    </div>
                `;
            }
            chatContainer.appendChild(messageDiv);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
