<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input[name="language"]').forEach(input => {
            input.addEventListener('change', (e) => {
                const saveBtn = document.getElementById('btn-save');
                if(e.target.value === 'en') {
                    saveBtn.innerHTML = 'Save <span class="material-symbols-outlined text-lg">check_circle</span>';
                } else {
                    saveBtn.innerHTML = 'Hifadhi <span class="material-symbols-outlined text-lg">check_circle</span>';
                }
            });
        });

        document.getElementById('btn-save').addEventListener('click', function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';
            btn.disabled = true;
            
            // Artificial delay to simulate save
            setTimeout(() => {
                btn.innerHTML = 'Imekamilika!';
                btn.classList.replace('bg-primary', 'bg-green-600');
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-green-600', 'bg-primary');
                    btn.disabled = false;
                }, 2000);
            }, 800);
        });
    </script>
